name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test tests/JellyfinHideMedia.Tests --logger "console;verbosity=normal"

  web:
    name: Web client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
